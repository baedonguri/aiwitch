[package]
name = "aiwitch"
version = "0.1.0"
edition = "2024"
description = "Multi-account / multi-profile switcher for AI CLIs (Codex, …)"
license = "MIT"
repository = "https://github.com/baedonguri/aiwitch"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
